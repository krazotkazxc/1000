<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Святого Валентина! ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 50px;
            background: #000000;
            color: white;
            overflow-y: auto;
            position: relative;
        }
        .hidden { display: none; }
        h1 { font-size: 40px; }
        p { font-size: 18px; }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background: #000000;
            color: white;
            border: none;
            border-radius: 50px;
            transition: 0.3s;
        }
        button:hover { background: #e6005c; }
        img { width: 200px; }
    </style>
</head>
<body>
    <h1>Ответь на вопросы, чтобы продолжить</h1>
    
    <div>
        <p>Как зовут мою кошку Омлет?</p>
        <img src="https://i.postimg.cc/S2LszktK/OMLET.jpg" alt="Кошка Омлет">
        <br>
        <input type="text" id="cat-name" placeholder="Имя кошки">
    </div>
    
    <div>
        <p>Сколько весят Наз и Даниэль вместе?</p>
        <img src="https://i.postimg.cc/n9HL4g6G/DANIEL.jpg" alt="Даниэль">
        <br>
        <input type="number" id="weight" placeholder="Вес">
    </div>
    
    <button onclick="checkAnswers()">Проверить</button>
    <button onclick="showHint()">Подсказка</button>
    
    <script>
        function checkAnswers() {
            let catName = document.getElementById('cat-name').value;
            let weight = document.getElementById('weight').value;
            if (catName.toLowerCase() === 'омлет' && weight == 100000) {
                alert('Ответы верные!');
            } else {
                alert('Ответы неверные! Попробуй снова.');
            }
        }
        
        function showHint() {
            alert('1. Кошку зовут Омлет.\n2. 1000 умножить на 100.');
        }
    </script>
</body>
</html>
